<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Взаимопомощь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0e1512; --bg2:#16221c; --surface:#1c2a22; --line:#2a3a30;
    --ink:#e8f0e8; --ink2:#a8b8a8; --ink3:#6a7a6a;
    --green:#2ecc88; --green-d:#1fa56a; --green-bg:#15382a;
    --warn:#f0b429; --err:#e5564f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 100%)}
  .pad{padding:18px 18px calc(28px + env(safe-area-inset-bottom))}
  h1{font:600 22px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;margin-bottom:4px}
  h2{font:600 18px/1.25 -apple-system,BlinkMacSystemFont,sans-serif;margin-bottom:12px}
  p.sub{color:var(--ink2);font-size:13.5px;margin-bottom:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:7px;font-weight:500}
  .inp{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);
    padding:14px 15px;border-radius:12px;font:inherit;outline:none;transition:.15s}
  .inp:focus{border-color:var(--green);background:#0a120e}
  .inp.mono{font-family:"SF Mono",Menlo,monospace;letter-spacing:.3px}
  textarea.inp{min-height:100px;resize:vertical}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .btn{display:block;width:100%;padding:15px;border:none;border-radius:12px;
    font:600 15px -apple-system,sans-serif;cursor:pointer;transition:.15s;
    background:var(--green);color:#062017}
  .btn:active{transform:scale(.98)}
  .btn:disabled{background:var(--line);color:var(--ink3);cursor:not-allowed}
  .btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.sec:disabled{color:var(--ink3)}
  .steps{display:flex;gap:6px;margin-bottom:20px}
  .steps i{flex:1;height:4px;border-radius:2px;background:var(--line);transition:.3s}
  .steps i.on{background:var(--green)}
  .check{display:flex;gap:11px;cursor:pointer;user-select:none;margin:10px 0;font-size:13.5px;color:var(--ink2)}
  .check .bx{width:22px;height:22px;border:2px solid var(--line);border-radius:7px;
    flex-shrink:0;display:grid;place-items:center;transition:.15s;margin-top:1px}
  .check .bx svg{width:13px;height:13px;stroke:#062017;stroke-width:3;fill:none;opacity:0}
  .check.on .bx{background:var(--green);border-color:var(--green)}
  .check.on .bx svg{opacity:1}
  .sum{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:16px}
  .sum .li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;
    border-bottom:1px solid var(--line);font-size:13.5px}
  .sum .li:last-child{border:none}
  .sum .k{color:var(--ink2)}
  .sum .v{color:var(--ink);font-weight:600;text-align:right;max-width:60%;word-break:break-word}
  .ok{text-align:center;padding:30px 20px}
  .ok .tk{width:70px;height:70px;border-radius:50%;background:var(--green-bg);
    display:grid;place-items:center;margin:0 auto 18px}
  .ok .tk svg{width:34px;height:34px;stroke:var(--green);stroke-width:2.6;fill:none}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:12px 18px;border-radius:12px;font-size:13.5px;opacity:0;
    transition:.25s;z-index:100;pointer-events:none;max-width:88%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hide{display:none!important}
  .num{font-family:"SF Mono",Menlo,monospace;letter-spacing:.3px}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
  .item h3{font:600 15px/1.3 -apple-system,sans-serif;margin-bottom:4px}
  .item .m{font-size:12.5px;color:var(--ink3);font-family:"SF Mono",monospace}
  .badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;margin-left:6px}
  .badge.check{background:#3d3017;color:#e6b84e}
  .badge.ok{background:var(--green-bg);color:#8dd9a9}
</style>
</head>
<body>
<div class="app">
  <div class="pad" id="screen-list">
    <h1>Взаимопомощь</h1>
    <p class="sub">Анонимные сборы на закрытие долгов. Подайте заявку, и она появится в ленте после модерации.</p>
    <button class="btn" id="btnStart">Подать заявку</button>
    <h2 style="margin-top:22px">Активные сборы</h2>
    <div class="list" id="list"></div>
  </div>

  <div class="pad hide" id="screen-form">
    <div class="steps" id="steps"><i class="on"></i><i></i></div>
    <h2 id="stepTitle">Шаг 1 из 2: Цель и история</h2>

    <!-- step 1 -->
    <div id="s1">
      <div class="card">
        <div class="field">
          <label>Ссылка на цель в CloudTips</label>
          <input class="inp" id="fLink" placeholder="https://tips.cloudtips.ru/...">
        </div>
        <div class="field">
          <label>История (от 10 символов)</label>
          <textarea class="inp" id="fStory" maxlength="500" placeholder="Расскажите, почему нужна помощь…"></textarea>
          <div style="text-align:right;font-size:12px;color:var(--ink3);margin-top:4px"><span id="cc">0</span>/500</div>
        </div>
        <div class="field">
          <label>Сумма долга, ₽</label>
          <input class="inp mono" id="fAmt" placeholder="120 000" inputmode="numeric">
        </div>
      </div>
    </div>

    <!-- step 2 -->
    <div id="s2" class="hide">
      <div class="card">
        <h2 style="margin-bottom:14px">Проверьте данные</h2>
        <div class="sum" id="sum"></div>
        <label class="check" id="c1">
          <span class="bx"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span>
          <span>Согласен на обработку персональных данных по 152‑ФЗ</span>
        </label>
        <label class="check" id="c2">
          <span class="bx"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></span>
          <span>Понимаю, что заявка публикуется анонимно</span>
        </label>
      </div>
    </div>

    <!-- ok -->
    <div id="sOk" class="hide">
      <div class="ok">
        <div class="tk"><svg viewBox="0 0 24 24"><path d="M5 12l4 4 10-10"/></svg></div>
        <h2>Заявка отправлена</h2>
        <p class="sub">Мы проверим её и опубликуем в ленте сборов. Статус появится здесь.</p>
      </div>
    </div>

    <div class="row" style="margin-top:14px">
      <button class="btn sec" id="btnBack">Назад</button>
      <button class="btn" id="btnNext">Далее</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }
  const haptic = t=>{ try{ tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} };
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // --- toast ---
  let tt;
  function toast(m){ const el=$('#toast'); el.textContent=m; el.classList.add('show');
    clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('show'),2200); }

  // --- demo list ---
  const demo=[
    {t:'Долг по ЖКХ, мать с двумя детьми', a:'120 000', r:'48 200', p:40},
    {t:'Микрозаймы после сокращения', a:'60 000', r:'17 900', p:30},
    {t:'Штраф ФССП — под угрозой авто', a:'95 000', r:'91 400', p:96},
  ];
  $('#list').innerHTML = demo.map(d=>
    `<div class="item"><h3>${esc(d.t)}<span class="badge ok">Проверено</span></h3>
     <div class="m">Собрано ${d.r} из ${d.a} ₽ (${d.p}%)</div></div>`).join('');

  // --- state ---
  let step=1, data={link:'',story:'',amt:'',c1:false,c2:false};
  const fmt=n=>Number(n).toLocaleString('ru-RU')+' ₽';

  // --- navigation ---
  $('#btnStart').onclick=()=>{ haptic('medium');
    $('#screen-list').classList.add('hide'); $('#screen-form').classList.remove('hide'); go(1); };
  $('#btnBack').onclick=()=>{ haptic('light');
    if($('#sOk').classList.contains('hide') && step>1) go(step-1);
    else { $('#screen-form').classList.add('hide'); $('#screen-list').classList.remove('hide'); }
  };
  $('#btnNext').onclick=()=>{ haptic('medium');
    if(!valid(step)){ toast('Заполните все поля корректно'); return; }
    if(step<2) go(step+1);
    else submit();
  };

  function go(n){
    step=n;
    ['s1','s2','sOk'].forEach((id,i)=> $(`#${id}`).classList.toggle('hide', i+1!==n && !(n===3 && id==='sOk')));
    if(n===3){ $('#sOk').classList.remove('hide'); }
    $$('#steps i').forEach((el,i)=> el.classList.toggle('on', i<n));
    $('#stepTitle').textContent = n===3 ? 'Готово' : `Шаг ${n} из 2: ${['Цель и история','Подтверждение'][n-1]}`;
    $('#btnBack').textContent = n===1 ? 'В ленту' : 'Назад';
    $('#btnNext').textContent = n===2 ? 'Отправить заявку' : 'Далее';
    $('#btnNext').disabled = !valid(n);
    if(n===2) buildSum();
    window.scrollTo(0,0);
  }

  // --- inputs ---
  const bind=(id,k,trans)=>{ const el=$('#'+id);
    el.addEventListener('input',e=>{ data[k]=trans?trans(e.target.value):e.target.value; $('#btnNext').disabled=!valid(step); });
  };
  bind('fLink','link');
  bind('fStory','story');
  $('#fStory').addEventListener('input',e=>{ $('#cc').textContent=e.target.value.length; });
  bind('fAmt','amt',v=>v.replace(/\D/g,''));
  $('#fAmt').addEventListener('input',e=>{ const n=+data.amt; $('#fAmt').value = n?fmt(n).replace(' ₽',''):''; });

  $('#c1').onclick=()=>{ data.c1=!data.c1; $('#c1').classList.toggle('on',data.c1); haptic('light'); $('#btnNext').disabled=!valid(2); };
  $('#c2').onclick=()=>{ data.c2=!data.c2; $('#c2').classList.toggle('on',data.c2); haptic('light'); $('#btnNext').disabled=!valid(2); };

  // --- validation ---
  function valid(n){
    if(n===1) return /cloudtips\.ru|https?:\/\//i.test(data.link) && data.story.trim().length>=10 && +data.amt>0;
    if(n===2) return data.c1 && data.c2;
    return false;
  }

  // --- summary ---
  function buildSum(){
    const rows=[
      ['Сумма долга', fmt(+data.amt||0)],
      ['CloudTips', data.link],
      ['История', data.story.trim().slice(0,80)+(data.story.length>80?'…':'')],
    ];
    $('#sum').innerHTML = rows.map(r=>`<div class="li"><span class="k">${r[0]}</span><span class="v">${esc(r[1])}</span></div>`).join('');
  }

  // --- submit ---
  function submit(){
    const payload = {
      type:'new_application',
      link:data.link, story:data.story, amount:+data.amt,
      ts:Date.now(),
      user: tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? {
        id: tg.initDataUnsafe.user.id,
        username: tg.initDataUnsafe.user.username || '',
        first_name: tg.initDataUnsafe.user.first_name || ''
      } : null
    };
    // отдаём данные Telegram-боту
    if(tg && tg.sendData){ try{ tg.sendData(JSON.stringify(payload)); }catch(e){} }
    console.log('[FSS] отправлена заявка:', payload);
    haptic('success');
    go(3);
    setTimeout(()=>{ try{ tg && tg.close && tg.close(); }catch(e){} }, 2800);
  }

  go(1);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Взаимопомощь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --fb:'Manrope',system-ui,sans-serif;--fd:'Outfit',var(--fb);
  --ink:#2c3a2e;--ink2:#5b6b5c;--ink3:#8b998b;
  --glass:rgba(255,255,255,.44);--glass2:rgba(255,255,255,.6);--brd:rgba(255,255,255,.65);
  --acc:#4e8f63;--acc2:#67a175;--acc-ink:#fff;--glow:rgba(78,143,99,.32);
  --track:rgba(255,255,255,.55);--warn:#b98a24;--err:#c05a54;
  --sh:0 12px 32px -12px rgba(56,88,60,.25);
}
html,body{height:100%}
body{color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  background:linear-gradient(165deg,#c7d7bf,#eaf0e4 42%,#d6e3ce)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;font-style:normal;font-size:180px;filter:blur(42px);opacity:.45;animation:sway 13s ease-in-out infinite alternate}
.bg i:nth-child(1){top:-40px;left:-50px}
.bg i:nth-child(2){top:26%;right:-70px;animation-delay:-4s;font-size:210px}
.bg i:nth-child(3){bottom:-30px;left:8%;animation-delay:-8s;font-size:160px}
.bg i:nth-child(4){bottom:22%;right:12%;animation-delay:-2s;font-size:120px;opacity:.3}
@keyframes sway{to{transform:translateY(16px) rotate(7deg)}}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}

header{position:sticky;top:0;z-index:30;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  background:rgba(255,255,255,.35);border-bottom:1px solid var(--brd);
  padding:calc(13px + env(safe-area-inset-top)) 18px 13px;display:flex;align-items:center;gap:11px}
.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(140deg,var(--acc2),var(--acc));
  display:grid;place-items:center;font-size:19px;box-shadow:0 6px 16px -4px var(--glow),inset 0 2px 3px rgba(255,255,255,.5)}
header h1{font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:.2px;flex:1}

main{flex:1;padding:16px 16px 110px}
.screen{display:none;animation:fd .35s ease}.screen.active{display:block}
@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

.glass{position:relative;overflow:hidden;background:var(--glass);border:1px solid var(--brd);border-radius:22px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--sh)}
.glass::before{content:"";position:absolute;inset:0 0 auto 0;height:50%;pointer-events:none;
  background:radial-gradient(130% 95% at 50% -30%,rgba(255,255,255,.55),transparent 62%)}

.banner{display:flex;gap:12px;align-items:center;padding:14px 15px;margin-bottom:14px}
.banner .ic{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--acc2),var(--acc));
  display:grid;place-items:center;font-size:17px;flex-shrink:0;box-shadow:inset 0 2px 3px rgba(255,255,255,.5),0 4px 12px -3px var(--glow)}
.banner p{font-size:12.5px;color:var(--ink2)}.banner b{color:var(--ink)}

.cta{width:100%;border:none;border-radius:18px;padding:17px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);
  font:800 15px var(--fb);margin-bottom:18px;box-shadow:0 12px 28px -8px var(--glow),inset 0 2px 3px rgba(255,255,255,.4);transition:.15s}
.cta:active{transform:scale(.97)}

.card{padding:16px;margin-bottom:13px;animation:up .55s cubic-bezier(.2,.7,.2,1) both;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 40px -14px rgba(56,88,60,.35)}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1}}
.card .top{display:flex;gap:12px;margin-bottom:11px;position:relative}
.ava{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex-shrink:0;
  box-shadow:inset 0 -8px 14px rgba(0,0,0,.14),inset 0 2px 4px rgba(255,255,255,.6),0 6px 14px -6px rgba(56,88,60,.4)}
.card h3{font-family:var(--fd);font-size:15.5px;font-weight:800;line-height:1.3}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  padding:4px 10px;border-radius:99px;background:rgba(78,143,99,.16);color:var(--acc);margin-top:5px}
.story{font-size:13px;color:var(--ink2);margin-bottom:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:8px;box-shadow:inset 0 1px 3px rgba(56,88,60,.15)}
.pbar i{display:block;height:100%;width:0;border-radius:99px;position:relative;overflow:hidden;
  background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 10px var(--glow);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.pbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shm 2.4s infinite}
@keyframes shm{60%,100%{transform:translateX(100%)}}
.amts{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}
.amts .r{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.amts .r.bump{animation:bump .5s}
@keyframes bump{35%{transform:scale(1.14);color:var(--acc)}}
.amts .g{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;position:relative}
.sup{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.bsup{border:none;border-radius:14px;padding:11px 17px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);font:800 13px var(--fb);
  display:flex;align-items:center;gap:7px;box-shadow:0 8px 18px -6px var(--glow),inset 0 2px 3px rgba(255,255,255,.4);transition:.15s}
.bsup:active{transform:scale(.93)}
.bsup svg{width:14px;height:14px;fill:currentColor}

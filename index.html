<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Взаимопомощь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--fb:'Manrope',system-ui,sans-serif;--fd:'Outfit',var(--fb);--ink:#2c3a2e;--ink2:#5b6b5c;--ink3:#8b998b;--glass2:rgba(255,255,255,.6);--brd:rgba(255,255,255,.65);--acc:#4e8f63;--acc2:#67a175;--acc-ink:#fff;--glow:rgba(78,143,99,.32);--track:rgba(255,255,255,.55);--warn:#b98a24;--err:#c05a54;--sh:0 12px 32px -12px rgba(56,88,60,.25)}
html,body{height:100%}
body{color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden;background:linear-gradient(165deg,#c7d7bf,#eaf0e4 42%,#d6e3ce)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;font-size:0;width:300px;height:300px;border-radius:50%;opacity:.45;background:radial-gradient(circle,#a9cfa0 0%,rgba(169,207,160,0) 70%);animation:sway 14s ease-in-out infinite alternate;will-change:transform}
.bg i:nth-child(1){top:-60px;left:-70px}
.bg i:nth-child(2){top:24%;right:-90px;animation-delay:-5s;width:340px;height:340px}
.bg i:nth-child(3){bottom:-40px;left:6%;animation-delay:-9s;width:260px;height:260px}
.bg i:nth-child(4){bottom:20%;right:10%;animation-delay:-3s;width:200px;height:200px;opacity:.3}
@keyframes sway{to{transform:translate3d(0,18px,0) rotate(4deg)}}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
header{position:sticky;top:0;z-index:30;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(255,255,255,.35);border-bottom:1px solid var(--brd);padding:calc(13px + env(safe-area-inset-top)) 18px 13px;display:flex;align-items:center;gap:10px}
.logo{width:39px;height:39px;border-radius:14px;background:linear-gradient(140deg,var(--acc2),var(--acc));display:grid;place-items:center;font-size:19px;box-shadow:0 6px 16px -4px var(--glow),inset 0 2px 3px rgba(255,255,255,.5)}
header h1{font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:.2px;flex:1}
.pill{background:rgba(255,255,255,.55);border:1px solid var(--brd);border-radius:12px;padding:8px 11px;font:800 12px var(--fb);color:var(--ink);white-space:nowrap}
.pill.lang{cursor:pointer}
main{flex:1;padding:16px 16px 110px;-webkit-overflow-scrolling:touch}
.screen{display:none;animation:fd .35s ease}.screen.active{display:block}
@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1}}
.glass{position:relative;overflow:hidden;background:rgba(255,255,255,.55);border:1px solid var(--brd);border-radius:22px;box-shadow:var(--sh)}
.glass::before{content:"";position:absolute;inset:0 0 auto 0;height:50%;pointer-events:none;background:radial-gradient(130% 95% at 50% -30%,rgba(255,255,255,.55),transparent 62%)}
.banner{display:flex;gap:12px;align-items:center;padding:14px 15px;margin-bottom:14px}
.banner .ic{width:36px;height:36px;border-radius:12px;background:linear-gradient(140deg,var(--acc2),var(--acc));display:grid;place-items:center;font-size:17px;flex-shrink:0;box-shadow:inset 0 2px 3px rgba(255,255,255,.5),0 4px 12px -3px var(--glow)}
.banner p{font-size:12.5px;color:var(--ink2)}.banner b{color:var(--ink)}
.cta{width:100%;border:none;border-radius:18px;padding:17px;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);font:800 15px var(--fb);margin-bottom:18px;box-shadow:0 12px 28px -8px var(--glow),inset 0 2px 3px rgba(255,255,255,.4);transition:.15s}
.cta:active{transform:scale(.97)}
.card{padding:16px;margin-bottom:13px;animation:up .55s cubic-bezier(.2,.7,.2,1) both;transition:transform .2s,box-shadow .2s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1}}
.card .top{display:flex;gap:12px;margin-bottom:11px;position:relative}
.ava{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex-shrink:0;box-shadow:inset 0 -8px 14px rgba(0,0,0,.14),inset 0 2px 4px rgba(255,255,255,.6),0 6px 14px -6px rgba(56,88,60,.4)}
.card h3{font-family:var(--fd);font-size:15.5px;font-weight:800;line-height:1.3}
.badge{display:inline-flex;gap:4px;align-items:center;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:rgba(78,143,99,.16);color:var(--acc);margin-top:5px}
.story{font-size:13px;color:var(--ink2);margin-bottom:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbar{height:10px;background:var(--track);border-radius:99px;overflow:hidden;margin-bottom:8px;box-shadow:inset 0 1px 3px rgba(56,88,60,.15)}
.pbar i{display:block;height:100%;width:0;border-radius:99px;position:relative;overflow:hidden;background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 10px var(--glow);transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.pbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shm 2.4s infinite}
@keyframes shm{60%,100%{transform:translateX(100%)}}
.amts{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:13px}
.amts .r{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.amts .r.bump{animation:bump .5s}
@keyframes bump{35%{transform:scale(1.14);color:var(--acc)}}
.amts .g{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.foot{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative}
.sup{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;align-items:center}
.bsup{border:none;border-radius:14px;padding:11px 15px;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);font:800 13px var(--fb);display:flex;align-items:center;gap:7px;box-shadow:0 8px 18px -6px var(--glow),inset 0 2px 3px rgba(255,255,255,.4);transition:.15s}
.bsup:active{transform:scale(.93)}
.bsup svg{width:14px;height:14px;fill:currentColor}
.ibtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--brd);background:rgba(255,255,255,.5);display:grid;place-items:center;cursor:pointer;font-size:15px;transition:.15s}
.ibtn:active{transform:scale(.9)}
/* колесо */
#scr-wheel{position:relative;margin:-16px -16px -110px;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 20px;min-height:100vh;background:radial-gradient(90% 60% at 50% 38%,#8a3ff0 0%,#7226d8 55%,#5b17b4 100%)}
body.wheel-on header{display:none}
body.wheel-on .tabbar{background:rgba(52,15,110,.55);border-top-color:rgba(255,255,255,.14)}
body.wheel-on .tab{color:rgba(255,255,255,.55)}
body.wheel-on .tab.active{color:#fff}
.wtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.wtitle{font-family:var(--fd);font-size:19px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.wcoins{background:#fff;color:#3a2350;border-radius:16px;padding:9px 14px;font:800 14px var(--fb);box-shadow:0 6px 16px -6px rgba(0,0,0,.4)}
.slot{position:relative;height:430px;overflow:hidden}
.slot .col{display:flex;flex-direction:column;gap:28px;align-items:center;will-change:transform;transition:transform 4.8s cubic-bezier(.1,.75,.12,1)}
.ticket{position:relative;width:248px;height:150px;border-radius:20px;flex-shrink:0;display:flex;flex-direction:column;gap:8px;padding:14px 16px 14px 18px;color:#1a0d2e;background:#fff;transform:rotate(var(--tilt,-5deg));overflow:hidden;border-left:6px solid var(--strip,#4f46e5);box-shadow:0 18px 40px -10px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.4)}
.ticket .head{display:flex;align-items:center;gap:10px}
.ticket .te{width:42px;height:42px;border-radius:12px;background:var(--strip,#4f46e5);display:grid;place-items:center;font-size:22px;flex-shrink:0;box-shadow:inset 0 -6px 10px rgba(0,0,0,.15)}
.ticket .tt{font:800 13px var(--fb);line-height:1.2;flex:1;color:#1a0d2e;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ticket .desc{font:12px/1.3 var(--fb);color:#5b4a6b;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ticket .ta{margin-top:auto;align-self:flex-start;font:800 12px var(--fb);background:var(--strip,#4f46e5);color:#fff;padding:5px 11px;border-radius:99px}
.mark{position:absolute;top:50%;width:0;height:0;border:11px solid transparent;z-index:3;transform:translateY(-50%);filter:drop-shadow(0 0 6px rgba(0,0,0,.4))}
.mark.l{left:6px;border-left:16px solid #fff}
.mark.r{right:6px;border-right:16px solid #fff}
.speed{position:absolute;inset:0;pointer-events:none;opacity:0;transition:.3s;background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.35) 46%,transparent 50%),linear-gradient(80deg,transparent 60%,rgba(255,255,255,.3) 64%,transparent 68%),linear-gradient(95deg,transparent 15%,rgba(255,255,255,.25) 19%,transparent 24%);background-size:100% 340px}
.slot.spinning .speed{opacity:1;animation:spd .45s linear infinite}
@keyframes spd{to{background-position:0 340px,0 300px,0 380px}}
.wspin{display:block;width:100%;border:none;border-radius:20px;padding:19px;cursor:pointer;margin-top:14px;background:#fff;color:#2a1440;font:900 16px var(--fd);letter-spacing:.5px;box-shadow:0 14px 30px -8px rgba(0,0,0,.45);transition:.15s}
.wspin:active{transform:scale(.97)}.wspin:disabled{opacity:.6}
.wlegal{text-align:center;font-size:11.5px;color:rgba(255,255,255,.65);margin-top:12px}
.wresult{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;align-items:center;padding:calc(20px + env(safe-area-inset-top)) 22px 24px;background:radial-gradient(100% 80% at 50% 20%,#4b2a6b 0%,#3a2054 50%,#2c1741 100%)}
.wresult.open{display:flex;animation:fd .3s}
.ray{position:absolute;top:-8%;width:34%;height:70%;background:linear-gradient(rgba(255,255,255,.28),transparent 80%);filter:blur(6px);pointer-events:none}
.ray.rl{left:2%;transform:rotate(24deg);transform-origin:top left}
.ray.rr{right:2%;transform:rotate(-24deg);transform-origin:top right}
.spark{position:absolute;color:#ffd60a;text-shadow:0 0 14px rgba(255,214,10,.8);animation:tw 1.6s ease-in-out infinite}
.s1{top:15%;right:12%;font-size:64px}.s2{top:11%;right:27%;font-size:30px;animation-delay:.4s}.s3{top:44%;left:9%;font-size:44px;animation-delay:.8s}
@keyframes tw{50%{transform:scale(.75) rotate(12deg);opacity:.7}}
.wclose{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;width:40px;height:40px;border-radius:50%;border:none;background:#fff;color:#3a2350;font-size:15px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
#wTicket{margin-top:6vh;animation:pop .6s cubic-bezier(.2,1.4,.4,1)}
#wTicket .ticket{width:270px;height:164px;--tilt:-6deg;box-shadow:0 28px 64px -12px rgba(0,0,0,.65),0 0 44px -4px rgba(164,77,240,.85)}
.wtimer{margin-top:24px;border:2px solid #fff;border-radius:99px;padding:8px 22px;font:800 20px var(--fb);letter-spacing:1px;font-variant-numeric:tabular-nums}
.wres-title{font-family:var(--fd);font-size:18px;font-weight:800;text-align:center;margin-top:15px;max-width:300px}
.wres-sub{font-size:13px;color:rgba(255,255,255,.75);text-align:center;margin-top:8px;max-width:300px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.wres-btns{display:flex;gap:10px;width:100%;margin-top:auto;padding-top:16px}
.wres-btns button{flex:1;border:none;border-radius:16px;padding:16px;font:800 14.5px var(--fb);cursor:pointer}
.wcopy{background:#fff;color:#2a1440}
.wsup{background:#ffd60a;color:#2a1440;box-shadow:0 10px 26px -8px rgba(255,214,10,.55)}
.wagain{margin-top:12px;border:none;background:none;color:rgba(255,255,255,.7);font:700 13px var(--fb);cursor:pointer;text-decoration:underline}
/* мои / админ */
.empty{text-align:center;padding:52px 20px}
.empty .ic{width:78px;height:78px;border-radius:26px;background:var(--glass2);border:1px solid var(--brd);display:grid;place-items:center;font-size:30px;margin:0 auto 15px}
.empty h3{font-family:var(--fd);font-size:16px;margin-bottom:8px}
.empty p{font-size:13px;color:var(--ink2);max-width:280px;margin:0 auto}
.req{padding:15px;margin-bottom:11px;animation:up .45s both}
.req .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;position:relative}
.st{font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:99px;text-transform:uppercase;letter-spacing:.4px}
.st.pending{background:rgba(185,138,36,.16);color:var(--warn)}
.st.approved{background:rgba(78,143,99,.16);color:var(--acc)}
.st.rejected{background:rgba(192,90,84,.14);color:var(--err)}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:16px}
.stat{padding:14px 6px;text-align:center}
.stat b{display:block;font-family:var(--fd);font-size:15px;color:var(--acc);font-variant-numeric:tabular-nums;position:relative}
.stat span{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
h2.tt{font-family:var(--fd);font-size:17px;font-weight:800;margin-bottom:14px}
h2.sm{font-family:var(--fd);font-size:13px;margin:16px 0 10px;color:var(--ink2)}
.abtns{display:flex;gap:8px;margin-top:11px;position:relative}
.abtns button{flex:1;border:none;border-radius:13px;padding:11px;font:800 13px var(--fb);cursor:pointer}
.okb{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink)}
.nob{background:rgba(192,90,84,.15);color:var(--err)}
/* топ помощников */
.trow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--brd)}
.trow:last-child{border:none}
.trow .medal{font-size:18px;width:24px}
.trow .nm{flex:1;font-weight:700;font-size:13px}
.trow .sm2{font-weight:800;font-size:12px;color:var(--acc)}
/* комментарии */
.clist{max-height:40vh;overflow-y:auto;margin:12px 0;display:flex;flex-direction:column;gap:8px}
.citem{background:rgba(255,255,255,.5);border:1px solid var(--brd);border-radius:12px;padding:10px 12px}
.citem b{font-size:12px;color:var(--acc)}
.citem p{font-size:13px;margin-top:3px}
.crow{display:flex;gap:8px}
.crow .inp{flex:1}
.crow button{border:none;border-radius:14px;padding:0 18px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);font:800 15px var(--fb);cursor:pointer}
/* форма */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:5px;border-radius:99px;background:var(--track)}
.steps i.on{background:linear-gradient(90deg,var(--acc2),var(--acc));box-shadow:0 0 8px var(--glow)}
.fcard{padding:17px;margin-bottom:14px}
.field{margin-bottom:15px;position:relative}.field:last-child{margin:0}
.field label{display:block;font-size:11.5px;font-weight:800;color:var(--ink2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.5px}
.inp{width:100%;background:var(--glass2);border:1.5px solid var(--brd);color:var(--ink);padding:14px 15px;border-radius:15px;font:inherit;font-size:14.5px;outline:none;transition:.15s}
.inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(78,143,99,.15);background:#fff}
textarea.inp{min-height:104px}
.cnt{text-align:right;font-size:11px;color:var(--ink3);margin-top:5px}
.sum{background:var(--glass2);border-radius:15px;padding:3px 14px;margin-bottom:14px;position:relative}
.sum .li{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--brd);font-size:13px}
.sum .li:last-child{border:none}
.sum .k{color:var(--ink3)}.sum .v{font-weight:700;text-align:right;max-width:62%;word-break:break-word}
.check{display:flex;gap:11px;cursor:pointer;margin:12px 0;font-size:13px;color:var(--ink2);position:relative}
.check .bx{width:23px;height:23px;border:2px solid var(--brd);border-radius:8px;flex-shrink:0;display:grid;place-items:center;background:var(--glass2);transition:.15s}
.check .bx svg{width:13px;height:13px;stroke:#fff;stroke-width:3.2;fill:none;opacity:0;transform:scale(.4);transition:.15s}
.check.on .bx{background:var(--acc);border-color:var(--acc)}
.check.on .bx svg{opacity:1;transform:none}
.rbtns{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:16px;padding:16px;font:800 14.5px var(--fb);cursor:pointer;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc2),var(--acc));color:var(--acc-ink);box-shadow:0 10px 22px -8px var(--glow),inset 0 2px 3px rgba(255,255,255,.4)}
.btn.pri:disabled{background:var(--track);color:var(--ink3);box-shadow:none}
.btn.sec{background:var(--glass2);color:var(--ink2);border:1px solid var(--brd);flex:0 0 34%}
.okwrap{text-align:center;padding:48px 24px}
.okwrap .tk{width:90px;height:90px;border-radius:30px;background:rgba(78,143,99,.16);display:grid;place-items:center;margin:0 auto 20px;animation:pop .55s cubic-bezier(.2,1.5,.4,1);box-shadow:0 0 34px -6px var(--glow)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.okwrap .tk svg{width:40px;height:40px;stroke:var(--acc);stroke-width:2.8;fill:none}
.okwrap h2{font-family:var(--fd);font-size:19px;font-weight:800;margin-bottom:9px}
.okwrap p{font-size:13.5px;color:var(--ink2);max-width:260px;margin:0 auto 26px}
/* шторки */
.ovl{position:fixed;inset:0;background:rgba(44,58,46,.35);z-index:49;opacity:0;visibility:hidden;transition:.3s;backdrop-filter:blur(4px)}
.ovl.open{opacity:1;visibility:visible}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:100%;max-width:480px;z-index:50;background:rgba(255,255,255,.75);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-top:1px solid var(--brd);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));transition:transform .45s cubic-bezier(.2,.85,.25,1)}
.sheet.open{transform:translate(-50%,0)}
.sheet h3{font-family:var(--fd);font-size:16px;font-weight:800;margin-bottom:4px}
.sheet .ss{font-size:12.5px;color:var(--ink2);margin-bottom:16px}
.chips{display:flex;gap:9px;margin-bottom:16px}
.chip{flex:1;border:1.5px solid var(--brd);background:var(--glass2);color:var(--ink2);border-radius:14px;padding:12px 0;font:800 13px var(--fb);cursor:pointer;transition:.15s;font-variant-numeric:tabular-nums}
.chip.on{border-color:var(--acc);color:var(--acc);background:rgba(78,143,99,.12);box-shadow:0 0 12px -3px var(--glow)}
/* таб-бар */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;background:rgba(255,255,255,.5);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--brd);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
body.in-form .tabbar{display:none}
.tab{flex:1;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;color:var(--ink3);font:700 10.5px var(--fb);transition:.2s;border-radius:14px}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;transition:.2s}
.tab.active{color:var(--acc)}
.tab.active svg{filter:drop-shadow(0 0 5px var(--glow))}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(14px);z-index:60;background:rgba(255,255,255,.7);backdrop-filter:blur(18px);border:1px solid var(--brd);padding:12px 19px;border-radius:16px;font-size:13px;font-weight:700;color:var(--ink);opacity:0;transition:.25s;pointer-events:none;max-width:86%;box-shadow:var(--sh)}
.toast.show{opacity:1;transform:translateX(-50%)}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<script>
(function(){
const q=new URLSearchParams(location.search);
const API=q.get('api')||(document.querySelector('meta[name="api-base"]')||{}).content||"https://fss-production-4ebb.up.railway.app";
const ADMIN_ID=+(q.get('admin')||1720219688);
const tg=window.Telegram&&window.Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();
  tg.setHeaderColor&&tg.setHeaderColor('#1c2721');
  tg.setBackgroundColor&&tg.setBackgroundColor('#c7d7bf');}catch(e){}}
const haptic=t=>{try{tg&&tg.HapticFeedback&&tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ru-RU');
const GRADS=['linear-gradient(140deg,#8fbf9a,#5d9468)','linear-gradient(140deg,#e4c989,#c9a355)','linear-gradient(140deg,#9db8d0,#6d8fae)','linear-gradient(140deg,#d0a8b8,#b07f92)','linear-gradient(140deg,#b8a8d8,#8f7fb5)','linear-gradient(140deg,#d8bc9a,#b5946d)'];
const EMO=['🏠','💳','🚗','','',''];

/* i18n */
const L={
ru:{feed:'Лента',wheel:'Колесо',mine:'Мои',admin:'Админ',apply:'＋ Подать заявку',banner:'<b>Анонимная взаимопомощь.</b> Истории без имён, каждая заявка проходит модерацию.',verified:'✓ проверено',supported:'поддержали',support:'Поддержать',outOf:'из',top:'🏆 Топ помощников недели',adsT:'Реклама и сотрудничество',adsB:'открыты к партнёрству',adsP:'Хотите разместить рекламу или предложить сотрудничество — пишите, всё обсудим!',wheelT:'Колесо добра 🎡',wheelL:'Нажимая «Вращать», ты просто делаешь добро 💚',spin:'🎲 ВРАЩАТЬ',sheetT:'Поддержать сбор',sheetS:'Выбери сумму — счётчик обновится у всех, оплата пойдёт на CloudTips.',sheetGo:'❤️ Поддержать и перейти',comT:'Комментарии 💬',comPh:'Написать пожелание…',mineT:'Мои заявки',admT:'Админ‑панель 🛠',pend:'⏳ На модерации',all:'Все заявки',del:'🗑 Удалить объявление',appr:'✅ Одобрить',rej:'❌ Отклонить',emptyF1:'Сборов пока нет',emptyF2:'Стань первым — подай заявку на сбор.',okT:'Заявка отправлена',okP:'Админ получит её на модерацию. Статус — во вкладке «Мои».',toMine:'К моим заявкам',back:'Назад',cancel:'Отмена',next:'Далее',sendApp:'Отправить заявку',step1:'Шаг 1 из 2 · Цель и история',step2:'Шаг 2 из 2 · Подтверждение',lLink:'Ссылка на цель CloudTips',lStory:'История (от 10 символов)',lSum:'Сумма долга, ₽',c1:'Согласен на обработку данных по 152‑ФЗ',c2:'Понимаю, что заявка публикуется анонимно',locked:'Не удалось проверить тебя',lockedP:'Мои заявки видны внутри мини‑аппа в Telegram.',emptyM1:'Пока нет заявок',emptyM2:'Подай первую — она появится здесь со статусом.',dayT:'Сбор дня: ',stPend:'на проверке',stLive:'в ленте',stSum:'₽ целей',noCom:'Пока нет комментариев — будь первым!',coinsLogin:'монет за вход'},
en:{feed:'Feed',wheel:'Wheel',mine:'Mine',admin:'Admin',apply:'＋ Apply',banner:'<b>Anonymous mutual aid.</b> Stories without names, every application is moderated.',verified:'✓ verified',supported:'supported',support:'Support',outOf:'of',top:'🏆 Top helpers of the week',adsT:'Ads & partnership',adsB:'open to partnership',adsP:'Want to place an ad or propose a partnership — write to us!',wheelT:'Wheel of Good 🎡',wheelL:'By spinning you simply do good 💚',spin:'🎲 SPIN',sheetT:'Support the cause',sheetS:'Pick an amount — the counter updates for everyone, payment goes to CloudTips.',sheetGo:'❤️ Support & go',comT:'Comments 💬',comPh:'Write a wish…',mineT:'My applications',admT:'Admin panel 🛠',pend:'⏳ Moderation',all:'All applications',del:'🗑 Delete',appr:'✅ Approve',rej:'❌ Reject',emptyF1:'No fundraisers yet',emptyF2:'Be the first — submit an application.',okT:'Application sent',okP:'The admin will review it. Status — in the "Mine" tab.',toMine:'My applications',back:'Back',cancel:'Cancel',next:'Next',sendApp:'Submit',step1:'Step 1 of 2 · Goal & story',step2:'Step 2 of 2 · Confirm',lLink:'CloudTips goal link',lStory:'Story (10+ chars)',lSum:'Debt amount, ₽',c1:'I agree to data processing (152‑FL)',c2:'I understand it is published anonymously',locked:'Verification failed',lockedP:'"Mine" is available inside the Telegram mini‑app.',emptyM1:'No applications yet',emptyM2:'Submit the first one — it will appear here.',dayT:'Fund of the day: ',stPend:'in review',stLive:'live',stSum:'₽ goals',noCom:'No comments yet — be the first!',coinsLogin:'login coins'}
};
let lang=localStorage.getItem('fss_lang')||'ru';
const t=k=>(L[lang]&&L[lang][k])||L.ru[k]||k;
function applyLang(){
  document.documentElement.lang=lang;
  $('#langBtn').textContent=lang.toUpperCase();
  $$('[data-k]').forEach(el=>el.textContent=t(el.dataset.k));
  $$('[data-ki]').forEach(el=>el.innerHTML=t(el.dataset.ki));
  $$('[data-kph]').forEach(el=>el.placeholder=t(el.dataset.kph));
}

let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2400);}

async function api(path,opts={}){
  const h=opts.headers||{};
  if(tg&&tg.initData)h['X-Telegram-InitData']=tg.initData;
  if(opts.body)h['Content-Type']='application/json';
  try{const r=await fetch(API+path,{...opts,headers:h});return await r.json();}
  catch(e){return{ok:false,error:String(e)};}
}
function countUp(el,to,dur=900){
  const from=+(el.dataset.cur||0),t0=performance.now();
  function f(t){const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(from+(to-from)*e))+' ₽';
    if(p<1)requestAnimationFrame(f);else el.dataset.cur=to;}
  requestAnimationFrame(f);
}
const meId=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user?tg.initDataUnsafe.user.id:null;
if(meId===ADMIN_ID)$('#adminTab').classList.remove('hide');

async function authDebugHTML(){
  const d=await api('/api/debug_auth');
  return `<p style="margin-top:10px;font-size:12px;color:var(--ink3)">🔍 header: ${d.header_present?'✅':'❌'} · token: ${d.token_set?'✅':'❌'} · sig: ${d.hash_match===true?'✅':(d.hash_match===false?'❌':'—')}<br>admin_id ${d.admin_id} / you ${meId}</p>`;
}

/* монетки */
async function claimCoins(){
  const r=await api('/api/coins/claim',{method:'POST',body:'{}'});
  if(r.ok){$('#coinPill').textContent='🪙 '+r.coins+(r.streak>1?' 🔥'+r.streak:'');
    if(!r.claimed&&r.earned)toast('🪙 +'+r.earned+' '+t('coinsLogin'));}
}

/* топ */
async function loadTop(){
  const r=await api('/api/top');
  if(!r.ok||!r.items.length){$('#topCard').style.display='none';return;}
  const M=['🥇','','🥉','4.','5.'];
  $('#topList').innerHTML=r.items.map((u,i)=>`<div class="trow"><span class="medal">${M[i]}</span><span class="nm">${esc(u.first_name||u.username||'—')}</span><span class="sm2">+${fmt(u.sum)} ₽</span></div>`).join('');
}

/* лента */
let collections=[];
async function loadCollections(){
  const cached=localStorage.getItem('fss_cache');
  if(cached){try{collections=JSON.parse(cached)||[];}catch(e){collections=[];}
    if(collections.length){renderList();buildSlot();}}
  const r=await api('/api/collections');
  collections=(r.ok&&r.items.length)?r.items:collections;
  if(collections.length)localStorage.setItem('fss_cache',JSON.stringify(collections));
  renderList();buildSlot();
}
function renderList(){
  if(!collections.length){$('#list').innerHTML='<div class="empty"><div class="ic">🌱</div><h3>'+t('emptyF1')+'</h3><p>'+t('emptyF2')+'</p></div>';return;}
  $('#list').innerHTML=collections.map((c,i)=>{
    const pct=Math.min(100,Math.round((c.raised||0)/c.amount*100));
    return `<div class="card glass" data-id="${c.id}" style="animation-delay:${i*70}ms">
      <div class="top"><div class="ava" style="background:${GRADS[i%6]}">${EMO[i%6]}</div>
      <div><h3>${esc(c.title||'—')}</h3><span class="badge">${t('verified')}</span></div></div>
      <p class="story">${esc(c.story)}</p>
      <div class="pbar"><i data-p="${pct}"></i></div>
      <div class="amts"><span class="r" data-cur="0">0 ₽</span><span class="g">${t('outOf')} ${fmt(c.amount)} ₽ · <b class="pct">${pct}%</b></span></div>
      <div class="foot"><span class="sup">❤️ <b class="supn">${c.supporters||0}</b> ${t('supported')}</span>
      <div class="acts">
        <button class="ibtn" data-com="${c.id}">💬</button>
        <button class="ibtn" data-share="${c.id}">🔗</button>
        <button class="bsup" data-id="${c.id}"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.5-9.2-9C1.3 8.7 3 5.5 6.2 5.5c2 0 3.2 1.2 3.8 2.3.6-1.1 1.8-2.3 3.8-2.3 3.2 0 4.9 3.2 3.4 6.5C19 16.5 12 21 12 21z"/></svg>${t('support')}</button>
      </div></div></div>`;
  }).join('');
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    $$('#list .card').forEach((card,i)=>{
      const c=collections[i];
      card.querySelector('.pbar i').style.width=Math.min(100,Math.round((c.raised||0)/c.amount*100))+'%';
      countUp(card.querySelector('.r'),c.raised||0,1100);
    });
  }));
  $$('#list .bsup').forEach(b=>b.onclick=()=>openSheet(+b.dataset.id));
  $$('#list [data-share]').forEach(b=>b.onclick=()=>{haptic('light');share(collections.find(x=>x.id==b.dataset.share));});
  $$('#list [data-com]').forEach(b=>b.onclick=()=>{haptic('light');openComments(+b.dataset.com);});
}
function share(c){
  if(!c)return;
  const text=(lang==='ru'?'Поможем закрыть долг: ':'Help close the debt: ')+c.title;
  const link='https://t.me/share/url?url='+encodeURIComponent(c.link)+'&text='+encodeURIComponent(text);
  if(tg&&tg.openTelegramLink){try{tg.openTelegramLink(link);return;}catch(e){}}
  location.href=link;
}

/* шторка поддержки */
let sheetId=null,sheetAmt=300;
function openSheet(id){sheetId=id;$('#ovl').classList.add('open');$('#sheet').classList.add('open');}
function closeSheet(){$('#ovl').classList.remove('open');$('#sheet').classList.remove('open');}
$('#ovl').onclick=closeSheet;
$$('#chips .chip').forEach(ch=>ch.onclick=()=>{haptic('light');sheetAmt=+ch.dataset.a;
  $$('#chips .chip').forEach(x=>x.classList.toggle('on',x===ch));});
$('#shGo').onclick=async()=>{
  if(!sheetId)return;
  haptic('heavy');
  const r=await api('/api/support',{method:'POST',body:JSON.stringify({id:sheetId,amount:sheetAmt})});
  const c=collections.find(x=>x.id===sheetId);
  if(r.ok&&c){
    c.raised=r.raised;c.supporters=r.supporters;
    const card=$(`#list .card[data-id="${sheetId}"]`);
    if(card){
      const num=card.querySelector('.r');countUp(num,r.raised,700);num.classList.remove('bump');void num.offsetWidth;num.classList.add('bump');
      card.querySelector('.supn').textContent=r.supporters;
      const pct=Math.min(100,Math.round(r.raised/c.amount*100));
      card.querySelector('.pbar i').style.width=pct+'%';
      card.querySelector('.pct').textContent=pct+'%';
    }
    toast(`❤️ +${fmt(sheetAmt)} ₽`);
    closeSheet();loadTop();
    if(c.link){if(tg&&tg.openLink){try{tg.openLink(c.link)}catch(e){location.href=c.link}}else location.href=c.link;}
  }else{toast(r.error||'…');}
};

/* комментарии */
let comId=null;
function openComments(id){comId=id;loadComments();$('#covl').classList.add('open');$('#csheet').classList.add('open');}
async function loadComments(){
  const r=await api('/api/comments?app='+comId);
  $('#clist').innerHTML=(r.ok&&r.items.length)?r.items.map(c=>`<div class="citem"><b>${esc(c.name)}</b><p>${esc(c.text)}</p></div>`).join(''):'<p class="story">'+t('noCom')+'</p>';
}
$('#csend').onclick=async()=>{
  const text=$('#cinp').value.trim();
  if(text.length<2||!comId)return;
  haptic('light');
  const r=await api('/api/comments',{method:'POST',body:JSON.stringify({app_id:comId,text})});
  if(r.ok){$('#cinp').value='';loadComments();}else toast(r.error||'…');
};
$('#covl').onclick=()=>{$('#covl').classList.remove('open');$('#csheet').classList.remove('open');};

/* колесо */
const STEP=178,TC=['#7ed32f','#2f8fe6','#f0382e','#a44df0','#22a7d8','#ff8c1a'];
let spinning=false,winner=null,tInt=null;
function ticketHTML(c,ei,tilt){
  const col=TC[ei%6];
  const short=(c.story||'').split(/\s+/).slice(0,9).join(' ')+((c.story||'').length>50?'…':'');
  return `<div class="ticket" style="--tilt:${tilt};--strip:${col}">
    <div class="head"><span class="te">${EMO[ei%6]}</span><span class="tt">${esc(c.title||'—')}</span></div>
    <span class="desc">${esc(short)}</span>
    <span class="ta">${fmt(c.amount)} ₽</span>
  </div>`;
}
function buildSlot(){
  const col=$('#slotCol');
  if(!collections.length){col.innerHTML='';return;}
  const rep=[...collections,...collections,...collections];
  col.innerHTML=rep.map((c,i)=>ticketHTML(c,collections.indexOf(c),(i%2?'4deg':'-5deg'))).join('');
  col.style.transition='none';col.style.transform='translateY(140px)';
  $('#wTotal').textContent=fmt(collections.reduce((s,c)=>s+(c.supporters||0),0));
}
$('#spinBtn').onclick=()=>{
  if(spinning||collections.length<2)return;
  spinning=true;haptic('medium');
  $('#spinBtn').disabled=true;$('#slot').classList.add('spinning');
  const n=collections.length,winIdx=2*n+Math.floor(Math.random()*n);
  winner=collections[winIdx%n];
  const col=$('#slotCol');
  col.style.transition='none';col.style.transform='translateY(140px)';
  void col.offsetWidth;
  col.style.transition='transform 4.8s cubic-bezier(.1,.75,.12,1)';
  col.style.transform=`translateY(${215-(winIdx*STEP+75)}px)`;
  setTimeout(()=>{
    spinning=false;$('#spinBtn').disabled=false;$('#slot').classList.remove('spinning');haptic('success');
    $('#wTicket').innerHTML=ticketHTML(winner,collections.indexOf(winner),'-6deg');
    $('#wResTitle').textContent=t('dayT')+(winner.title||'');
    $('#wResSub').textContent=winner.story||'';
    let dl=+localStorage.getItem('fss_dl')||0;
    if(!dl||dl<Date.now()){dl=Date.now()+864e5;localStorage.setItem('fss_dl',dl);}
    clearInterval(tInt);
    const tick=()=>{let s=Math.max(0,Math.floor((dl-Date.now())/1000));
      $('#wTimer').textContent=[s/3600,s%3600/60,s%60].map(x=>String(Math.floor(x)).padStart(2,'0')).join(':');};
    tick();tInt=setInterval(tick,1000);
    $('#wresult').classList.add('open');
  },5000);
};
$('#wClose').onclick=()=>$('#wresult').classList.remove('open');
$('#wAgain').onclick=()=>{$('#wresult').classList.remove('open');setTimeout(()=>$('#spinBtn').click(),350);};
$('#wCopy').onclick=async()=>{haptic('light');try{await navigator.clipboard.writeText(winner.link);}catch(e){}toast('📋');};
$('#wSup').onclick=()=>{haptic('medium');openSheet(winner.id);};

/* мои */
async function loadMine(){
  const r=await api('/api/my'),el=$('#mineList');
  if(!r.ok){
    el.innerHTML=`<div class="empty"><div class="ic">🔒</div><h3>${t('locked')}</h3><p>${t('lockedP')}</p>${await authDebugHTML()}</div>`;return;}
  if(!r.items.length){el.innerHTML=`<div class="empty"><div class="ic">📭</div><h3>${t('emptyM1')}</h3><p>${t('emptyM2')}</p></div>`;return;}
  const NM={pending:'⏳',approved:'✅',rejected:'❌'};
  el.innerHTML=r.items.map((a,i)=>`<div class="req glass" style="animation-delay:${i*50}ms">
    <div class="h"><b>#{a.id}</b>.replace('#{a.id}','Заявка #'+a.id)<span class="st ${a.status}">${NM[a.status]||a.status}</span></div>
    <p class="story">${esc(a.story)}</p>
    <div class="amts" style="margin:0"><span class="r" style="font-size:14px">${fmt(a.amount)} ₽</span><span class="g">${new Date(a.created_at).toLocaleDateString('ru-RU')}</span></div></div>`).join('');
}

/* админ */
async function loadAdmin(){
  const s=await api('/api/admin/stats');
  if(!s.ok){
    $('#admDebug').innerHTML=`<div class="req glass"><b>🔍</b>${await authDebugHTML()}</div>`;
    toast('403');return;
  }
  $('#admDebug').innerHTML='';
  $('#admStats').innerHTML=`<div class="stat glass"><b>${s.pending}</b><span>${t('stPend')}</span></div>
    <div class="stat glass"><b>${s.approved}</b><span>${t('stLive')}</span></div>
    <div class="stat glass"><b>${fmt(s.approved_sum)}</b><span>${t('stSum')}</span></div>`;
  const p=await api('/api/admin/list?status=pending');
  $('#admPending').innerHTML=(p.ok&&p.items.length)?p.items.map(a=>`<div class="req glass">
    <div class="h"><b>#${a.id} · ${fmt(a.amount)} ₽</b><span class="st pending">⏳</span></div>
    <p class="story">${esc(a.story)}</p><p class="story" style="margin:0">🔗 ${esc(a.link)}<br>👤 ${esc(a.first_name||'—')} @${esc(a.username||'—')}</p>
    <div class="abtns"><button class="okb" data-act="approve" data-id="${a.id}">${t('appr')}</button>
    <button class="nob" data-act="reject" data-id="${a.id}">${t('rej')}</button></div></div>`).join(''):'<p class="wlegal" style="color:var(--ink3)">🎉</p>';
  const all=await api('/api/admin/list');
  $('#admAll').innerHTML=all.ok?all.items.slice(0,10).map(a=>`<div class="req glass"><div class="h"><b>#${a.id}</b><span class="st ${a.status}">${a.status}</span></div><p class="story" style="margin:0">${esc(a.title||a.story)}</p>
    <div class="abtns"><button class="nob" data-del="${a.id}">${t('del')}</button></div></div>`).join(''):'';
  $$('#scr-admin [data-act]').forEach(b=>b.onclick=async()=>{
    haptic('medium');
    await api('/api/admin/action',{method:'POST',body:JSON.stringify({id:+b.dataset.id,action:b.dataset.act})});
    toast(b.dataset.act==='approve'?'✅':'❌');
    loadAdmin();loadCollections();
  });
  $$('#scr-admin [data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('#'+b.dataset.del+'?'))return;
    haptic('medium');
    await api('/api/admin/delete',{method:'POST',body:JSON.stringify({id:+b.dataset.del})});
    toast('🗑');
    loadAdmin();loadCollections();
  });
}

/* вкладки */
function show(id){$$('.screen').forEach(s=>s.classList.remove('active'));$('#scr-'+id).classList.add('active');window.scrollTo(0,0);}
function switchTab(t2){haptic('light');$$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t2));
  document.body.classList.remove('in-form');
  document.body.classList.toggle('wheel-on',t2==='wheel');
  show(t2);
  if(t2==='wheel')buildSlot();
  if(t2==='mine')loadMine();if(t2==='admin')loadAdmin();if(t2==='collections')loadCollections();}
$$('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

/* форма */
let step=1,data={link:'',story:'',amt:'',c1:false,c2:false};
$('#ctaApply').onclick=()=>{haptic('medium');document.body.classList.add('in-form');show('form');go(1);};
function go(n){step=n;$('#s1').classList.toggle('hide',n!==1);$('#s2').classList.toggle('hide',n!==2);
  $$('.steps i').forEach((e,i)=>e.classList.toggle('on',i<n));
  $('#stepTitle').textContent=t(n===1?'step1':'step2');
  $('#btnBack').textContent=n===1?t('cancel'):t('back');
  $('#btnNext').textContent=n===2?t('sendApp'):t('next');
  $('#btnNext').disabled=!valid(n);if(n===2)buildSum();window.scrollTo(0,0);}
function valid(n){if(n===1)return /https?:\/\//.test(data.link)&&data.story.trim().length>=10&&+data.amt>0;return data.c1&&data.c2;}
function buildSum(){$('#sum').innerHTML=[[t('lSum'),fmt(+data.amt||0)+' ₽'],['CloudTips',data.link],[t('lStory'),data.story.slice(0,70)+(data.story.length>70?'…':'')]]
  .map(r=>`<div class="li"><span class="k">${r[0]}</span><span class="v">${esc(r[1])}</span></div>`).join('');}
const bind=(id,k,tr)=>$('#'+id).addEventListener('input',e=>{data[k]=tr?tr(e.target.value):e.target.value;$('#btnNext').disabled=!valid(step);});
bind('fLink','link');bind('fStory','story');
$('#fStory').addEventListener('input',e=>$('#cc').textContent=e.target.value.length);
bind('fAmt','amt',v=>v.replace(/\D/g,''));
$('#fAmt').addEventListener('input',e=>{const n=+data.amt;e.target.value=n?fmt(n):'';});
$('#c1').onclick=()=>{data.c1=!data.c1;$('#c1').classList.toggle('on',data.c1);haptic('light');$('#btnNext').disabled=!valid(2);};
$('#c2').onclick=()=>{data.c2=!data.c2;$('#c2').classList.toggle('on',data.c2);haptic('light');$('#btnNext').disabled=!valid(2);};
$('#btnBack').onclick=()=>{haptic('light');step>1?go(step-1):switchTab('collections');};
$('#btnNext').onclick=async()=>{haptic('medium');
  if(!valid(step))return toast('…');
  if(step<2)return go(step+1);
  const r=await api('/api/applications',{method:'POST',body:JSON.stringify({link:data.link,story:data.story,amount:+data.amt})});
  if(!r.ok)return toast(r.error||'…');
  haptic('success');show('ok');};
$('#btnToMine').onclick=()=>switchTab('mine');

/* реклама + язык */
$('#adTg').onclick=()=>{haptic('light');const u='https://t.me/dmitriizmll';
  if(tg&&tg.openLink){try{tg.openLink(u)}catch(e){location.href=u}}else location.href=u;};
$('#adMail').onclick=()=>{haptic('light');location.href='mailto:boss_rf@inbox.ru';};
$('#langBtn').onclick=()=>{haptic('light');lang=lang==='ru'?'en':'ru';localStorage.setItem('fss_lang',lang);
  applyLang();renderList();go(step);};

/* старт */
applyLang();
claimCoins();
loadTop();
loadCollections();
})();
